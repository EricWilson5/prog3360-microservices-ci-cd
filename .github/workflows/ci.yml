name: Microservices CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build All Services
        run: |
          mvn -pl product-service -am clean verify
          mvn -pl order-service -am clean verify

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          path: "**/target/surefire-reports/*.xml"

  docker-orchestration:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Build and Start Infrastructure
        run: docker compose up -d --build

      - name: Wait for Healthy Services
        run: |
          echo "Waiting for services to report healthy..."
          timeout 120s bash -c 'until [ $(docker compose ps | grep -c "(healthy)") -ge 2 ]; do sleep 5; done'

      - name: Verify API Availability
        run: |
          curl -f http://localhost:8081/api/products || exit 1
          curl -f http://localhost:8082/api/orders || exit 1

      - name: Cleanup
        if: always()
        run: docker compose down