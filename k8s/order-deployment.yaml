apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: prog3360-assignment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-api
          image: order-service:v1
          ports:
            - containerPort: 8082
          env:
            - name: PRODUCT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: PRODUCT_SERVICE_URL